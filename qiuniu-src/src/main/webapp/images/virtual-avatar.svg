<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>囚牛全身 Avatar v8</title>
<style>
body { margin:0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.avatar-container { text-align: center; }
.avatar-container h2 { color: #e94560; font-family: -apple-system, "Microsoft YaHei", sans-serif; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="avatar-container">
<h2>囚牛 Avatar v8 — 头发在最上层</h2>
<svg width="320" height="400" viewBox="0 0 320 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4d6"/>
      <stop offset="100%" style="stop-color:#f5d4c0"/>
    </linearGradient>
    <pattern id="plaidPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#4a6fa5"/>
      <rect x="0" y="0" width="10" height="10" fill="#3d5a87"/>
      <rect x="10" y="10" width="10" height="10" fill="#3d5a87"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#5a7fb8" stroke-width="1.5"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#5a7fb8" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb6c1;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffb6c1;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <ellipse cx="160" cy="380" rx="80" ry="12" fill="#000" opacity="0.2"/>

  <rect x="125" y="320" width="28" height="55" rx="4" fill="#2c3e50"/>
  <rect x="167" y="320" width="28" height="55" rx="4" fill="#2c3e50"/>
  <ellipse cx="139" cy="378" rx="18" ry="10" fill="#1a252f"/>
  <ellipse cx="181" cy="378" rx="18" ry="10" fill="#1a252f"/>

  <ellipse cx="160" cy="260" rx="85" ry="95" fill="url(#plaidPattern)"/>
  <ellipse cx="145" cy="240" rx="25" ry="30" fill="#2c3e50" opacity="0.15"/>

  <path d="M 130 175 L 160 205 L 190 175 L 180 165 L 160 190 L 140 165 Z" fill="#fff"/>
  <circle cx="160" cy="230" r="4" fill="#fff" opacity="0.9"/>
  <circle cx="160" cy="260" r="4" fill="#fff" opacity="0.9"/>
  <circle cx="160" cy="290" r="4" fill="#fff" opacity="0.9"/>

  <ellipse cx="75" cy="240" rx="22" ry="50" fill="url(#plaidPattern)" transform="rotate(20 75 240)"/>
  <ellipse cx="245" cy="240" rx="22" ry="50" fill="url(#plaidPattern)" transform="rotate(-20 245 240)"/>
  <rect x="55" y="270" width="24" height="8" rx="2" fill="#fff" transform="rotate(20 67 274)"/>
  <rect x="241" y="270" width="24" height="8" rx="2" fill="#fff" transform="rotate(-20 253 274)"/>
  <circle cx="65" cy="285" r="14" fill="url(#skinGrad)"/>
  <circle cx="255" cy="285" r="14" fill="url(#skinGrad)"/>

  <rect x="145" y="150" width="30" height="25" fill="url(#skinGrad)"/>

  <!-- 头（先画） -->
  <ellipse cx="160" cy="115" rx="65" ry="70" fill="url(#skinGrad)"/>

  <!-- 耳朵 -->
  <ellipse cx="98" cy="115" rx="10" ry="14" fill="url(#skinGrad)"/>
  <ellipse cx="222" cy="115" rx="10" ry="14" fill="url(#skinGrad)"/>

  <!-- 头顶头发（最后画，在头上面） -->
  <ellipse cx="160" cy="62" rx="52" ry="26" fill="#1a1a1a"/>
  <ellipse cx="142" cy="55" rx="14" ry="6" fill="#333" opacity="0.5"/>

  <!-- 刘海（画在头上，但不超过眉毛） -->
  <path d="M 108 68 Q 125 78 140 72 Q 155 82 160 76 Q 165 82 180 72 Q 195 78 212 68" stroke="#1a1a1a" stroke-width="11" fill="none" stroke-linecap="round"/>

  <!-- 眉毛 -->
  <path d="M 125 100 Q 135 97 145 100" stroke="#5d4e37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 175 100 Q 185 97 195 100" stroke="#5d4e37" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <ellipse cx="135" cy="113" rx="10" ry="12" fill="#fff"/>
  <ellipse cx="185" cy="113" rx="10" ry="12" fill="#fff"/>
  <circle cx="137" cy="113" r="6" fill="#2c3e50"/>
  <circle cx="187" cy="113" r="6" fill="#2c3e50"/>
  <circle cx="139" cy="111" r="2.5" fill="#fff"/>
  <circle cx="189" cy="111" r="2.5" fill="#fff"/>

  <!-- 鼻子 -->
  <path d="M 158 123 Q 160 130 162 123" stroke="#d4a574" stroke-width="1.5" fill="none"/>

  <!-- 嘴巴（微笑） -->
  <path d="M 145 140 Q 160 150 175 140" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="115" cy="130" rx="12" ry="8" fill="url(#blushGrad)"/>
  <ellipse cx="205" cy="130" rx="12" ry="8" fill="url(#blushGrad)"/>
</svg>
</div>
</body>
</html>